name: Deploy Azure Resources

# Configuration variables - easily change these values for different environments
env:
  # Default resource configuration (used when not triggered via workflow_dispatch)
  DEFAULT_RESOURCE_GROUP: "RealTest"
  DEFAULT_LOCATION: "canadacentral"
  DEFAULT_BICEP_FILE_PATH: "./deploy/template.bicep"
  
  # Expected resource types for validation
  EXPECTED_RESOURCE_TYPES: |
    Microsoft.Communication/communicationServices
    Microsoft.Communication/emailServices
    Microsoft.Sql/servers
    Microsoft.Storage/storageAccounts
    Microsoft.Web/serverfarms
    Microsoft.Web/sites

on:
  push:
    branches: [ AzureDeployResourcesTest ]
  pull_request:
    branches: [ AzureDeployResourcesTest ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: 'Name of the resource group'
        required: true
        default: 'AzureDeployTest'
      location:
        description: 'Azure region to deploy resources'
        required: true
        default: 'eastus'
      bicepFilePath:
        description: 'Path to the Bicep file'
        required: true
        default: './deploy/template.bicep'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AzureDeploy

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEPLOY }}
    
    - name: Set variables from workflow dispatch or defaults
      id: set-vars
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "RESOURCE_GROUP=${{ github.event.inputs.resourceGroupName }}" >> $GITHUB_ENV
          echo "LOCATION=${{ github.event.inputs.location }}" >> $GITHUB_ENV
          echo "BICEP_FILE=${{ github.event.inputs.bicepFilePath }}" >> $GITHUB_ENV
        else
          echo "RESOURCE_GROUP=${{ env.DEFAULT_RESOURCE_GROUP }}" >> $GITHUB_ENV
          echo "LOCATION=${{ env.DEFAULT_LOCATION }}" >> $GITHUB_ENV
          echo "BICEP_FILE=${{ env.DEFAULT_BICEP_FILE_PATH }}" >> $GITHUB_ENV
        fi
    
    - name: Create Resource Group
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Creating resource group ${{ env.RESOURCE_GROUP }} in ${{ env.LOCATION }}"
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }}

    - name: Deploy Bicep File Directly
      id: arm-deploy
      continue-on-error: true  # This ensures the workflow continues even if deployment "fails"
      uses: azure/arm-deploy@v1
      with:
        resourceGroupName: ${{ env.RESOURCE_GROUP }}
        template: ${{ env.BICEP_FILE }}
        parameters: administratorLoginPassword=${{ secrets.DB_ADMIN_PASSWORD }}
        failOnStdErr: false
        deploymentName: 'github-action-deployment'

    - name: Wait for Resources to Provision
      run: |
        echo "Waiting 60 seconds for resources to finish provisioning..."
        sleep 60

    - name: Extract Expected Resources
      id: extract-resources
      run: |
        # Install Bicep CLI
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --version
        
        # Generate JSON for analysis without deploying
        BICEP_FILE="${{ env.BICEP_FILE }}"
        JSON_FILE="${BICEP_FILE%.bicep}.json"
        echo "Converting Bicep file $BICEP_FILE to $JSON_FILE for analysis only"
        bicep build $BICEP_FILE --outfile $JSON_FILE
        
        # Extract only top-level resource types from the template
        echo "Extracting top-level resource types from the template..."
        RESOURCE_TYPES=$(jq -r '.resources[] | .type' $JSON_FILE | \
                         awk -F'/' '{ if (NF <= 2) print $0 }' | \
                         sort | uniq)
        echo "Expected top-level resource types:"
        echo "$RESOURCE_TYPES"
        echo "RESOURCE_TYPES<<EOF" >> $GITHUB_ENV
        echo "$RESOURCE_TYPES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Validate Required Resources
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Checking for resources in resource group ${{ env.RESOURCE_GROUP }}..."

          # Get all resources in the resource group
          RESOURCES=$(az resource list --resource-group ${{ env.RESOURCE_GROUP }} --query "[].{type:type, name:name}" -o json)
          echo "Resources found in resource group:"
          echo "$RESOURCES" | jq

          # Extract and save actual resource types
          echo "Creating resource type list..."
          echo "$RESOURCES" | jq -r '.[] | .type' > /tmp/actual_types.txt

          # Check for each resource type from the template
          VALIDATION_FAILED=false

          # Expected resource types from the environment variable
          cat << EOF > /tmp/expected_types.txt
          ${{ env.EXPECTED_RESOURCE_TYPES }}
          EOF

          while IFS= read -r RESOURCE_TYPE; do
            # Skip empty lines
            [ -z "$RESOURCE_TYPE" ] && continue
            
            echo "Checking for resource type: $RESOURCE_TYPE"
            
            # Convert to lowercase for case-insensitive comparison
            RESOURCE_TYPE_LOWER=$(echo "$RESOURCE_TYPE" | tr '[:upper:]' '[:lower:]')
            
            # Check for exact matches (case-insensitive)
            EXACT_MATCH_COUNT=0
            while IFS= read -r ACTUAL_TYPE; do
              ACTUAL_TYPE_LOWER=$(echo "$ACTUAL_TYPE" | tr '[:upper:]' '[:lower:]')
              if [ "$ACTUAL_TYPE_LOWER" = "$RESOURCE_TYPE_LOWER" ]; then
                EXACT_MATCH_COUNT=$((EXACT_MATCH_COUNT + 1))
              fi
            done < /tmp/actual_types.txt
            
            if [ "$EXACT_MATCH_COUNT" -gt 0 ]; then
              echo "✅ Found $EXACT_MATCH_COUNT resources of type $RESOURCE_TYPE (case-insensitive match)"
              continue
            fi
            
            # If no exact match, try partial matching on the resource name part
            RESOURCE_PROVIDER=$(echo "$RESOURCE_TYPE" | cut -d'/' -f1)
            RESOURCE_NAME=$(echo "$RESOURCE_TYPE" | cut -d'/' -f2)
            RESOURCE_NAME_LOWER=$(echo "$RESOURCE_NAME" | tr '[:upper:]' '[:lower:]')
            
            PARTIAL_MATCH_COUNT=0
            while IFS= read -r ACTUAL_TYPE; do
              ACTUAL_PROVIDER=$(echo "$ACTUAL_TYPE" | cut -d'/' -f1)
              ACTUAL_NAME=$(echo "$ACTUAL_TYPE" | cut -d'/' -f2)
              ACTUAL_NAME_LOWER=$(echo "$ACTUAL_NAME" | tr '[:upper:]' '[:lower:]')
              
              # Check if providers match and resource names are similar
              if [ "$ACTUAL_PROVIDER" = "$RESOURCE_PROVIDER" ] && [[ "$ACTUAL_NAME_LOWER" == *"$RESOURCE_NAME_LOWER"* ]] || [[ "$RESOURCE_NAME_LOWER" == *"$ACTUAL_NAME_LOWER"* ]]; then
                PARTIAL_MATCH_COUNT=$((PARTIAL_MATCH_COUNT + 1))
                echo "  - Found similar resource: $ACTUAL_TYPE"
              fi
            done < /tmp/actual_types.txt
            
            if [ "$PARTIAL_MATCH_COUNT" -gt 0 ]; then
              echo "✅ Found $PARTIAL_MATCH_COUNT resources similar to $RESOURCE_TYPE"
            else
              echo "❌ ERROR: No resources of type $RESOURCE_TYPE or similar were found"
              VALIDATION_FAILED=true
            fi
          done < /tmp/expected_types.txt

          if [ "$VALIDATION_FAILED" = true ]; then
            echo "Resource validation failed. Some expected resources were not found in the resource group."
            exit 1
          else
            echo "All required resource types have been successfully validated!"
          fi