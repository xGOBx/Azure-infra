name: Deploy Azure Resources

on:
  push:
    branches: [ AzureDeployResources ]
  pull_request:
    branches: [ AzureDeployResources ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: 'Name of the resource group'
        required: true
        default: 'AzureDeployTest'
      location:
        description: 'Azure region to deploy resources'
        required: true
        default: 'eastus'
      bicepFilePath:
        description: 'Path to the Bicep file'
        required: true
        default: './deploy/template.bicep'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AzureDeploy

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEPLOY }}
    
    - name: Set variables from workflow dispatch or defaults
      id: set-vars
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "RESOURCE_GROUP=${{ github.event.inputs.resourceGroupName }}" >> $GITHUB_ENV
          echo "LOCATION=${{ github.event.inputs.location }}" >> $GITHUB_ENV
          echo "BICEP_FILE=${{ github.event.inputs.bicepFilePath }}" >> $GITHUB_ENV
        else
          echo "RESOURCE_GROUP=AzureDeployTest" >> $GITHUB_ENV
          echo "LOCATION=eastus" >> $GITHUB_ENV
          echo "BICEP_FILE=./deploy/template.bicep" >> $GITHUB_ENV
        fi
    
    - name: Create Resource Group
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Creating resource group ${{ env.RESOURCE_GROUP }} in ${{ env.LOCATION }}"
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }}

    - name: Install Bicep CLI
      run: |
        curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
        chmod +x ./bicep
        sudo mv ./bicep /usr/local/bin/bicep
        bicep --version

    - name: Convert Bicep to JSON
      id: convert-bicep
      run: |
        BICEP_FILE="${{ env.BICEP_FILE }}"
        JSON_FILE="${BICEP_FILE%.bicep}.json"
        echo "Converting Bicep file $BICEP_FILE to $JSON_FILE"
        bicep build $BICEP_FILE --outfile $JSON_FILE
        echo "JSON_TEMPLATE=$JSON_FILE" >> $GITHUB_ENV

    - name: Attempt ARM Deployment (Ignoring Errors)
      id: arm-deploy
      continue-on-error: true  # This ensures the workflow continues even if deployment "fails"
      uses: azure/arm-deploy@v1
      with:
        resourceGroupName: ${{ env.RESOURCE_GROUP }}
        template: ${{ env.JSON_TEMPLATE }}
        parameters: administratorLoginPassword=${{ secrets.DB_ADMIN_PASSWORD }}
        failOnStdErr: false
        deploymentName: 'github-action-deployment'

    - name: Wait for Resources to Provision
      run: |
        echo "Waiting 90 seconds for resources to finish provisioning..."
        sleep 90

    - name: Validate Required Resources
      uses: azure/CLI@v1
      with:
        inlineScript: |
          echo "Checking for resources in resource group ${{ env.RESOURCE_GROUP }}..."
          
          # Get all resources in the resource group
          RESOURCES=$(az resource list --resource-group ${{ env.RESOURCE_GROUP }} --query "[].{type:type, name:name}" -o json)
          echo "Resources found in resource group:"
          echo "$RESOURCES" | jq
          
          # Define core resource types to check (only the main ones, not all sub-resources)
          CORE_RESOURCE_TYPES=(
            "Microsoft.Storage/storageAccounts"
            "Microsoft.Insights/components"
            "Microsoft.Sql/servers"
            "Microsoft.Web/sites"
            "Microsoft.Web/serverfarms"
            "Microsoft.Communication/CommunicationServices"
            "Microsoft.Communication/EmailServices"
          )
          
          # Check for core resource types
          VALIDATION_FAILED=false
          
          for RESOURCE_TYPE in "${CORE_RESOURCE_TYPES[@]}"; do
            echo "Checking for resource type: $RESOURCE_TYPE"
            
            # For exact match and case-insensitive check
            RESOURCE_COUNT=$(echo "$RESOURCES" | jq -r "[.[] | select(.type | ascii_downcase == \"$RESOURCE_TYPE\" | ascii_downcase)] | length")
            
            if [ "$RESOURCE_COUNT" -gt 0 ]; then
              echo "✅ Found $RESOURCE_COUNT resources of type $RESOURCE_TYPE"
            else
              echo "❌ ERROR: No resources of type $RESOURCE_TYPE were found"
              VALIDATION_FAILED=true
            fi
          done
          
          # Special case for SQL databases (child resources)
          echo "Checking for SQL databases..."
          DB_COUNT=$(echo "$RESOURCES" | jq -r '[.[] | select(.type == "Microsoft.Sql/servers/databases" and .name != "**/master")] | length')
          if [ "$DB_COUNT" -gt 0 ]; then
            echo "✅ Found $DB_COUNT SQL database(s)"
          else
            echo "❌ ERROR: No SQL databases were found"
            VALIDATION_FAILED=true
          fi
          
          if [ "$VALIDATION_FAILED" = true ]; then
            echo "Resource validation failed. Some core resources were not found in the resource group."
            exit 1
          else
            echo "✅ All core resource types have been successfully validated!"
          fi